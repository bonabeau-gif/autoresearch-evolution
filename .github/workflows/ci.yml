name: Test orchestration
on:
  push:
  pull_request:
  workflow_dispatch:
jobs:
  unit:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Compile source (without GPU dependencies)
        run: python -m compileall -q autoresearch_evo prepare.py train.py
      - name: Run unit and fake-training integration tests
        run: python -m unittest discover -s tests -v
